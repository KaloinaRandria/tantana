# ===== Base de test (TANTANA_TEST) =====
# Fonctionne seul (profil actif = test) ou avec dev (profils actifs = dev,test).

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/TANTANA_TEST}
# Identifiants : application-secret.properties (hors git) ou variables d'environnement
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Migrations + utilisateurs/roles (db/test) ; jamais les donnees de dev (db/dev)
spring.flyway.locations=classpath:db/migration,classpath:db/test

# Templates recharges sans redemarrer (comme en dev)
spring.thymeleaf.cache=false

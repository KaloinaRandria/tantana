<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Messages de succes / erreur transmis apres une redirection (flash attributes) -->
<div th:fragment="alertes">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${succes}">OK</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${erreur}">Erreur</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
</div>

<!-- Barre de recherche + filtre de statut. Utilise ${q} et ${statut} du modele. -->
<form th:fragment="filtres(url, indice)" th:action="@{${url}}" method="get" class="row g-2 mb-3">
    <div class="col-12 col-md-6">
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" name="q" th:value="${q}" class="form-control" th:placeholder="${indice}">
        </div>
    </div>
    <div class="col-8 col-md-3">
        <select name="statut" class="form-select" onchange="this.form.submit()">
            <option value="actifs" th:selected="${statut == 'actifs'}">Actifs</option>
            <option value="inactifs" th:selected="${statut == 'inactifs'}">Inactifs</option>
            <option value="tous" th:selected="${statut == 'tous'}">Tous</option>
        </select>
    </div>
    <div class="col-4 col-md-3 d-grid">
        <button class="btn btn-outline-secondary" type="submit">Rechercher</button>
    </div>
</form>

<!--
    Pagination a fenetre : « ‹ 1 … 4 5 [6] 7 8 … 100 › » (5 numeros autour de la page courante,
    plus la premiere et la derniere). Les liens reprennent tous les filtres de l'URL courante
    (${lienPagination}, fourni par NavigationAdvice) : il suffit de passer la Page.
-->
<nav th:fragment="pagination(page)" th:if="${page.totalPages > 1}" class="mt-3" aria-label="Pagination"
     th:with="n=${page.number},
              dernier=${page.totalPages - 1},
              borne=${page.number - 2 < page.totalPages - 5 ? page.number - 2 : page.totalPages - 5},
              debut=${borne < 0 ? 0 : borne},
              fin=${debut + 4 > dernier ? dernier : debut + 4}">
    <ul class="pagination pagination-sm justify-content-center flex-wrap mb-1">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <span th:if="${page.first}" class="page-link" aria-hidden="true">&lsaquo;</span>
            <a th:unless="${page.first}" class="page-link" th:href="${lienPagination + (n - 1)}" aria-label="Page précédente">&lsaquo;</a>
        </li>
        <th:block th:if="${debut > 0}">
            <li class="page-item"><a class="page-link" th:href="${lienPagination + 0}">1</a></li>
            <li class="page-item disabled" th:if="${debut > 1}"><span class="page-link">…</span></li>
        </th:block>
        <li th:each="i : ${#numbers.sequence(debut, fin)}" class="page-item"
            th:classappend="${i == n} ? 'active' : ((${i - n > 1 or n - i > 1}) ? 'd-none d-sm-block' : '')">
            <a class="page-link" th:href="${lienPagination + i}" th:text="${i + 1}"
               th:attr="aria-current=${i == n} ? 'page'">1</a>
        </li>
        <th:block th:if="${fin < dernier}">
            <li class="page-item disabled" th:if="${fin < dernier - 1}"><span class="page-link">…</span></li>
            <li class="page-item"><a class="page-link" th:href="${lienPagination + dernier}" th:text="${dernier + 1}">100</a></li>
        </th:block>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <span th:if="${page.last}" class="page-link" aria-hidden="true">&rsaquo;</span>
            <a th:unless="${page.last}" class="page-link" th:href="${lienPagination + (n + 1)}" aria-label="Page suivante">&rsaquo;</a>
        </li>
    </ul>
    <p class="text-center small text-muted mb-0">
        Page <span th:text="${n + 1}">1</span> sur <span th:text="${page.totalPages}">1</span>
        — <span th:text="${#numbers.formatInteger(page.totalElements, 1, 'WHITESPACE')}">0</span> élément(s)
    </p>
</nav>

<!--
    Filtre de periode, a placer DANS le formulaire GET de l'ecran (les autres filtres sont conserves).
    Chaque bouton envoie « periode » ; « Appliquer » envoie les dates saisies (periode personnalisee).
    Les dates sont avant les boutons : la touche Entree dans une date applique la plage saisie.
-->
<div th:fragment="periode(f)" class="filtre-periode">
    <div class="d-flex flex-wrap align-items-center gap-2">
        <div class="d-flex flex-wrap align-items-center gap-1 ms-lg-auto order-lg-2">
            <label class="small text-muted" for="filtre-du">Du</label>
            <input type="date" id="filtre-du" name="du" class="form-control form-control-sm w-auto" th:value="${f.du}">
            <label class="small text-muted" for="filtre-au">au</label>
            <input type="date" id="filtre-au" name="au" class="form-control form-control-sm w-auto" th:value="${f.au}">
            <button type="submit" name="periode" value="PERSONNALISEE" class="btn btn-sm"
                    th:classappend="${f.periode.name() == 'PERSONNALISEE'} ? 'btn-primary' : 'btn-outline-primary'">Appliquer</button>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-1 order-lg-1">
            <button th:each="p : ${f.rapides}" type="submit" name="periode" th:value="${p}"
                    class="btn btn-sm" th:classappend="${p == f.periode} ? 'btn-primary' : 'btn-outline-secondary'"
                    th:attr="aria-pressed=${p == f.periode}" th:text="${p.libelle}">Ce mois</button>
            <div class="dropdown" th:unless="${f.autres.empty}">
                <button type="button" class="btn btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"
                        th:classappend="${f.activeDansAutres} ? 'btn-primary' : 'btn-outline-secondary'"
                        th:text="${f.activeDansAutres} ? ${f.periode.libelle} : 'Plus'">Plus</button>
                <ul class="dropdown-menu">
                    <li th:each="p : ${f.autres}">
                        <button type="submit" name="periode" th:value="${p}" class="dropdown-item"
                                th:classappend="${p == f.periode} ? 'active'" th:text="${p.libelle}">Hier</button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="small text-muted mt-1">
        <i class="bi bi-calendar3"></i> Période : <strong th:text="${f.periode.libelle}">Ce mois</strong>
        — <span th:text="${f.description}">du 01/11/2026 au 25/11/2026</span>
    </div>
</div>

<!-- Badge Actif / Inactif -->
<span th:fragment="badgeStatut(actif)">
    <span th:if="${actif}" class="badge text-bg-success">Actif</span>
    <span th:unless="${actif}" class="badge text-bg-secondary">Inactif</span>
</span>

<!-- Bouton activer / desactiver (POST + CSRF) -->
<!-- La desactivation passe par la fenetre de confirmation commune ; la reactivation est directe -->
<form th:fragment="boutonStatut(url, actif)" th:action="@{${url}}" method="post" class="d-inline"
      th:attr="data-confirmation=${actif} ? 'Cet élément ne sera plus proposé dans les nouvelles saisies. Vous pourrez le réactiver à tout moment.' : null,
               data-confirmation-titre=${actif} ? 'Désactiver' : null,
               data-confirmation-bouton=${actif} ? 'Désactiver' : null,
               data-confirmation-style=${actif} ? 'warning' : null">
    <button th:if="${actif}" type="submit" class="btn btn-sm btn-outline-warning" title="Désactiver">
        <i class="bi bi-pause-circle"></i>
    </button>
    <button th:unless="${actif}" type="submit" class="btn btn-sm btn-outline-success" title="Réactiver">
        <i class="bi bi-play-circle"></i>
    </button>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Clients</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Clients</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <p class="text-muted mb-0"><span th:text="${page.totalElements}">0</span> client(s)</p>
        <a th:href="@{/clients/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouveau client</a>
    </div>

    <form th:replace="~{fragments/commun :: filtres('/clients', 'Nom, téléphone ou NIF')}"></form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Type</th>
                    <th>Contact</th>
                    <th>NIF / STAT</th>
                    <th class="text-end">Plafond de crédit</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="7" class="text-center text-muted py-4">Aucun client trouvé.</td>
                </tr>
                <tr th:each="c : ${page.content}" th:classappend="${!c.actif} ? 'text-muted'">
                    <td>
                        <span class="fw-semibold" th:text="${c.nom}">Nom</span>
                        <span th:if="${c.comptoir}" class="badge text-bg-info ms-1" title="Client générique des ventes anonymes">Comptoir</span>
                    </td>
                    <td th:text="${c.type.libelle}">Particulier</td>
                    <td class="small">
                        <div th:if="${c.telephone}" th:text="${c.telephone}">tel</div>
                        <a th:if="${c.email}" th:href="'mailto:' + ${c.email}" th:text="${c.email}">email</a>
                    </td>
                    <td class="small">
                        <div th:if="${c.nif}">NIF <span th:text="${c.nif}">nif</span></div>
                        <div th:if="${c.stat}" class="text-muted">STAT <span th:text="${c.stat}">stat</span></div>
                    </td>
                    <td class="text-end text-nowrap">
                        <span th:if="${c.creditAutorise}"
                              th:text="${#numbers.formatDecimal(c.plafondCredit, 1, 'WHITESPACE', 0, 'COMMA')} + ' MGA'">0</span>
                        <span th:unless="${c.creditAutorise}" class="text-muted small">Comptant</span>
                    </td>
                    <td><span th:replace="~{fragments/commun :: badgeStatut(${c.actif})}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clients/{id}/modifier(id=${c.id})}" class="btn btn-sm btn-outline-primary"
                           title="Modifier"><i class="bi bi-pencil"></i></a>
                        <!-- th:block : th:replace passe avant th:unless, le test doit etre sur un element parent -->
                        <th:block th:unless="${c.comptoir}">
                            <form th:replace="~{fragments/commun :: boutonStatut('/clients/' + ${c.id} + '/statut', ${c.actif})}"></form>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/commun :: pagination(${page})}"></nav>
</main>
</body>
</html>

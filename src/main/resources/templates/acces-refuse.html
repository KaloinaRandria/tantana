<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Accès refusé</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Accès refusé</h1>

<main layout:fragment="content">
    <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-shield-lock text-danger" style="font-size:3rem"></i>
            <h2 class="h4 mt-3">Accès refusé</h2>
            <p class="text-muted mb-4">Vous n'avez pas les droits nécessaires pour accéder à cette page.</p>
            <a th:href="@{/}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour à l'accueil</a>
        </div>
    </div>
</main>
</body>
</html>

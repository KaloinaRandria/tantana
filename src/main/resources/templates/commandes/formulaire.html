<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${commande == null} ? 'Nouvelle commande' : 'Modifier ' + ${commande.numero}">Commande</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0"
    th:text="${commande == null} ? 'Nouvelle commande d\'achat' : 'Modifier la commande ' + ${commande.numero}">Commande</h1>

<main layout:fragment="content">
<form th:action="@{/achats/commandes/enregistrer}" th:object="${form}" method="post" novalidate id="form-commande">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{version}">

    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}" class="mb-0">Erreur</p>
    </div>

    <!-- ===== En-tete ===== -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <h2 class="h6 text-uppercase text-muted mb-3">Commande</h2>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="fournisseurId" class="form-label">Fournisseur <span class="text-danger">*</span></label>
                    <select th:field="*{fournisseurId}" class="form-select"
                            th:classappend="${#fields.hasErrors('fournisseurId')} ? 'is-invalid'">
                        <option value="">— Choisir —</option>
                        <option th:each="f : ${fournisseurs}" th:value="${f.id}" th:attr="data-devise=${f.devise}"
                                th:text="${f.nom} + ' (' + ${f.pays} + ')' + (${f.actif} ? '' : ' — désactivé')">Fournisseur</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{fournisseurId}">Erreur</div>
                </div>
                <div class="col-6 col-md-3">
                    <label for="dateCommande" class="form-label">Date de commande <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{dateCommande}" class="form-control"
                           th:classappend="${#fields.hasErrors('dateCommande')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{dateCommande}">Erreur</div>
                </div>
                <div class="col-6 col-md-3">
                    <label for="dateArriveePrevue" class="form-label">Arrivée prévue <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{dateArriveePrevue}" class="form-control"
                           th:classappend="${#fields.hasErrors('dateArriveePrevue')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{dateArriveePrevue}">Erreur</div>
                </div>
                <div class="col-6 col-md-3">
                    <label for="devise" class="form-label">Devise <span class="text-danger">*</span></label>
                    <select th:field="*{devise}" class="form-select"
                            th:classappend="${#fields.hasErrors('devise')} ? 'is-invalid'">
                        <option value="">—</option>
                        <option th:each="d : ${devises}" th:value="${d}" th:text="${d} + ' — ' + ${d.libelle}">USD</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{devise}">Erreur</div>
                </div>
                <div class="col-6 col-md-3">
                    <label for="tauxChange" class="form-label">Taux de change <span class="text-danger">*</span></label>
                    <div class="input-group has-validation">
                        <span class="input-group-text">1 <span class="ms-1 libelle-devise" th:text="*{devise} ?: '?'">USD</span>&nbsp;=</span>
                        <input type="number" step="0.000001" min="0" th:field="*{tauxChange}" class="form-control text-end"
                               th:classappend="${#fields.hasErrors('tauxChange')} ? 'is-invalid'">
                        <span class="input-group-text">MGA</span>
                        <div class="invalid-feedback" th:errors="*{tauxChange}">Erreur</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="observations" class="form-label">Observations</label>
                    <input type="text" th:field="*{observations}" class="form-control"
                           placeholder="Conditions, mode d'expédition, référence proforma…"
                           th:classappend="${#fields.hasErrors('observations')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{observations}">Erreur</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Lignes ===== -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 text-uppercase text-muted mb-0">Articles commandés</h2>
                <button type="button" class="btn btn-sm btn-outline-primary" id="ajouter-ligne">
                    <i class="bi bi-plus-lg"></i> Ajouter un article
                </button>
            </div>

            <div th:if="${#fields.hasErrors('lignes')}" class="alert alert-danger py-2" th:errors="*{lignes}">Erreur</div>

            <div class="table-responsive">
                <table class="table align-middle mb-0" id="table-lignes">
                    <thead class="table-light">
                    <tr>
                        <th style="min-width:260px">Article</th>
                        <th style="width:150px" class="text-end">Quantité</th>
                        <th style="width:180px" class="text-end">Prix unitaire (<span class="libelle-devise" th:text="*{devise} ?: '?'">USD</span>)</th>
                        <th style="width:160px" class="text-end">Montant</th>
                        <th style="width:50px"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l, it : *{lignes}" class="ligne">
                        <td>
                            <select th:field="*{lignes[__${it.index}__].articleId}" class="form-select form-select-sm champ-article"
                                    th:classappend="${#fields.hasErrors('lignes[__${it.index}__].articleId')} ? 'is-invalid'">
                                <option value="">— Choisir —</option>
                                <option th:each="a : ${articles}" th:value="${a.id}"
                                        th:text="${a.reference} + ' — ' + ${a.designation} + ' (' + ${a.unite.libelle} + ')'">Article</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{lignes[__${it.index}__].articleId}">Erreur</div>
                        </td>
                        <td>
                            <input type="number" step="0.001" min="0" th:field="*{lignes[__${it.index}__].quantite}"
                                   class="form-control form-control-sm text-end champ-quantite"
                                   th:classappend="${#fields.hasErrors('lignes[__${it.index}__].quantite')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{lignes[__${it.index}__].quantite}">Erreur</div>
                        </td>
                        <td>
                            <input type="number" step="0.0001" min="0" th:field="*{lignes[__${it.index}__].prixUnitaire}"
                                   class="form-control form-control-sm text-end champ-prix"
                                   th:classappend="${#fields.hasErrors('lignes[__${it.index}__].prixUnitaire')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{lignes[__${it.index}__].prixUnitaire}">Erreur</div>
                        </td>
                        <td class="text-end montant-ligne">0,00</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-danger supprimer-ligne" title="Retirer">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-semibold">
                        <td colspan="3" class="text-end">Total</td>
                        <td class="text-end text-nowrap"><span id="total-devise">0,00</span> <span class="libelle-devise" th:text="*{devise} ?: ''"></span></td>
                        <td></td>
                    </tr>
                    <tr class="text-muted small">
                        <td colspan="3" class="text-end">Estimation en Ariary (au taux saisi)</td>
                        <td class="text-end text-nowrap"><span id="total-mga">0</span> MGA</td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
        <a th:href="${commande == null} ? @{/achats/commandes} : @{/achats/commandes/{id}(id=${commande.id})}"
           class="btn btn-outline-secondary">Annuler</a>
    </div>
</form>

<!-- Modele de ligne vide, clone par le bouton « Ajouter un article » -->
<template id="modele-ligne">
    <tr class="ligne">
        <td>
            <select data-champ="articleId" class="form-select form-select-sm champ-article">
                <option value="">— Choisir —</option>
                <option th:each="a : ${articles}" th:if="${a.actif}" th:value="${a.id}"
                        th:text="${a.reference} + ' — ' + ${a.designation} + ' (' + ${a.unite.libelle} + ')'">Article</option>
            </select>
        </td>
        <td><input type="number" step="0.001" min="0" data-champ="quantite" class="form-control form-control-sm text-end champ-quantite"></td>
        <td><input type="number" step="0.0001" min="0" data-champ="prixUnitaire" class="form-control form-control-sm text-end champ-prix"></td>
        <td class="text-end montant-ligne">0,00</td>
        <td class="text-end">
            <button type="button" class="btn btn-sm btn-outline-danger supprimer-ligne" title="Retirer"><i class="bi bi-trash"></i></button>
        </td>
    </tr>
</template>

<script th:src="@{/js/commande-achat.js}"></script>
</main>
</body>
</html>

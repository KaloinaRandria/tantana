<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Commandes d'achat</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Commandes d'achat</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <p class="text-muted mb-0"><span th:text="${page.totalElements}">0</span> commande(s)</p>
        <a th:href="@{/achats/commandes/nouvelle}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle commande</a>
    </div>

    <!-- Filtres -->
    <form th:action="@{/achats/commandes}" method="get" class="row g-2 mb-3 align-items-center">
        <div class="col-12 col-md-3">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" name="q" th:value="${q}" class="form-control" placeholder="N° de commande">
            </div>
        </div>
        <div class="col-6 col-md-3">
            <select name="statut" class="form-select" onchange="this.form.submit()">
                <option value="">Tous les statuts</option>
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}"
                        th:selected="${s == statut}">Statut</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <select name="fournisseurId" class="form-select" onchange="this.form.submit()" data-recherche="Rechercher un fournisseur" data-recherche-vide>
                <option value="">Tous les fournisseurs</option>
                <option th:each="f : ${fournisseurs}" th:value="${f.id}" th:text="${f.nom}"
                        th:selected="${f.id == fournisseurId}">Fournisseur</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="retard" value="true" id="retard"
                       th:checked="${retard}" onchange="this.form.submit()">
                <label class="form-check-label" for="retard">En retard</label>
            </div>
        </div>
        <div class="col-6 col-md-1 d-grid">
            <button class="btn btn-outline-secondary" type="submit" title="Rechercher"><i class="bi bi-funnel"></i></button>
        </div>
        <div class="col-12">
            <div th:replace="~{fragments/commun :: periode(${filtre})}"></div>
        </div>
    </form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>N°</th>
                    <th>Fournisseur</th>
                    <th>Commandée le</th>
                    <th>Arrivée prévue</th>
                    <th class="text-end">Montant</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Aucune commande trouvée.</td>
                </tr>
                <tr th:each="c : ${page.content}">
                    <td>
                        <a th:href="@{/achats/commandes/{id}(id=${c.id})}" class="fw-semibold text-decoration-none"
                           th:text="${c.numero}">CA-2026-0001</a>
                    </td>
                    <td th:text="${c.fournisseur.nom}">Fournisseur</td>
                    <td th:text="${#temporals.format(c.dateCommande, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <span th:text="${#temporals.format(c.dateArriveePrevue, 'dd/MM/yyyy')}">01/02/2026</span>
                        <span th:if="${c.enRetard}" class="badge text-bg-danger ms-1"><i class="bi bi-clock-history"></i> En retard</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <span th:text="${#numbers.formatDecimal(c.montantTotal, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span>
                        <small class="text-muted" th:text="${c.devise.code}">USD</small>
                    </td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${c.statut.couleur}"
                              th:text="${c.statut.libelle}">Statut</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination (conserve les filtres) -->
    <nav th:replace="~{fragments/commun :: pagination(${page})}"></nav>
</main>
</body>
</html>

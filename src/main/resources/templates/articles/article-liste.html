<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Articles</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Articles</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <p class="text-muted mb-0">
            <span th:text="${page.totalElements}">0</span> article(s)
        </p>
        <a th:href="@{/articles/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvel article</a>
    </div>

    <form th:replace="~{fragments/commun :: filtres('/articles', 'Référence ou désignation')}"></form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Référence</th>
                    <th>Désignation</th>
                    <th>Unité</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="5" class="text-center text-muted py-4">Aucun article trouvé.</td>
                </tr>
                <tr th:each="a : ${page.content}" th:classappend="${!a.actif} ? 'text-muted'">
                    <td><code th:text="${a.reference}">ART-0001</code></td>
                    <td>
                        <div th:text="${a.designation}">Désignation</div>
                        <div class="small text-muted text-truncate" style="max-width:420px"
                             th:if="${a.description}" th:text="${a.description}">description</div>
                    </td>
                    <td th:text="${a.unite.libelle}">Pièce</td>
                    <td><span th:replace="~{fragments/commun :: badgeStatut(${a.actif})}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/articles/{id}/modifier(id=${a.id})}" class="btn btn-sm btn-outline-primary"
                           title="Modifier"><i class="bi bi-pencil"></i></a>
                        <form th:replace="~{fragments/commun :: boutonStatut('/articles/' + ${a.id} + '/statut', ${a.actif})}"></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/commun :: pagination(${page})}"></nav>
</main>
</body>
</html>

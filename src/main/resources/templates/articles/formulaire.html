<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${article.id == null} ? 'Nouvel article' : 'Modifier l\'article'">Article</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0"
    th:text="${article.id == null} ? 'Nouvel article' : 'Modifier l\'article ' + ${article.reference}">Article</h1>

<main layout:fragment="content">
    <div class="card border-0 shadow-sm" style="max-width: 760px">
        <div class="card-body p-4">
            <form th:action="@{/articles/enregistrer}" th:object="${article}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}" class="mb-0">Erreur</p>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="reference" class="form-label">Référence <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{reference}" class="form-control text-uppercase"
                               th:classappend="${#fields.hasErrors('reference')} ? 'is-invalid'"
                               placeholder="ART-0001" maxlength="50" autofocus>
                        <div class="invalid-feedback" th:errors="*{reference}">Erreur</div>
                    </div>
                    <div class="col-md-8">
                        <label for="designation" class="form-label">Désignation <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{designation}" class="form-control"
                               th:classappend="${#fields.hasErrors('designation')} ? 'is-invalid'" maxlength="200">
                        <div class="invalid-feedback" th:errors="*{designation}">Erreur</div>
                    </div>
                    <div class="col-md-4">
                        <label for="unite" class="form-label">Unité de stock <span class="text-danger">*</span></label>
                        <select th:field="*{unite}" class="form-select"
                                th:classappend="${#fields.hasErrors('unite')} ? 'is-invalid'">
                            <option th:each="u : ${unites}" th:value="${u}" th:text="${u.libelle}">Pièce</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{unite}">Erreur</div>
                    </div>
                    <div class="col-12">
                        <label for="description" class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}">Erreur</div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
                    <a th:href="@{/articles}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>

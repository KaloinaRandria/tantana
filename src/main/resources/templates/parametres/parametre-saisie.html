<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Paramètres</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Paramètres</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <form th:action="@{/admin/parametres}" th:object="${parametre}" method="post" novalidate
          data-confirmation-titre="Enregistrer les paramètres"
          data-confirmation="La TVA et la remise maximale s'appliqueront aux prochaines ventes. Les factures déjà émises ne changent pas."
          data-confirmation-bouton="Enregistrer">
        <input type="hidden" th:field="*{version}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}" class="mb-0">Erreur</p>
        </div>

        <!-- ===== Ventes ===== -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <h2 class="h6 text-uppercase text-muted mb-3">Ventes</h2>
                <div class="row g-3">
                    <div class="col-sm-6 col-md-4">
                        <label for="tauxTva" class="form-label">Taux de TVA <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <input type="number" step="0.01" min="0" max="100" th:field="*{tauxTva}" class="form-control text-end"
                                   th:classappend="${#fields.hasErrors('tauxTva')} ? 'is-invalid'">
                            <span class="input-group-text">%</span>
                            <div class="invalid-feedback" th:errors="*{tauxTva}">Erreur</div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label for="remiseMaxVendeur" class="form-label">Remise maximale du vendeur <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <input type="number" step="0.01" min="0" max="100" th:field="*{remiseMaxVendeur}" class="form-control text-end"
                                   th:classappend="${#fields.hasErrors('remiseMaxVendeur')} ? 'is-invalid'">
                            <span class="input-group-text">%</span>
                            <div class="invalid-feedback" th:errors="*{remiseMaxVendeur}">Erreur</div>
                        </div>
                        <div class="form-text">Au-delà, la vente devra être validée par un CHECKER.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Societe ===== -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <h2 class="h6 text-uppercase text-muted mb-1">Société</h2>
                <p class="small text-muted mb-3">Ces informations apparaîtront sur les factures.</p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="raisonSociale" class="form-label">Raison sociale <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{raisonSociale}" class="form-control" maxlength="150"
                               th:classappend="${#fields.hasErrors('raisonSociale')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{raisonSociale}">Erreur</div>
                    </div>
                    <div class="col-md-6">
                        <label for="adresse" class="form-label">Adresse</label>
                        <input type="text" th:field="*{adresse}" class="form-control" maxlength="255"
                               th:classappend="${#fields.hasErrors('adresse')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{adresse}">Erreur</div>
                    </div>
                    <div class="col-md-6">
                        <label for="telephone" class="form-label">Téléphone</label>
                        <input type="tel" th:field="*{telephone}" class="form-control" maxlength="50"
                               th:classappend="${#fields.hasErrors('telephone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{telephone}">Erreur</div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" th:field="*{email}" class="form-control" maxlength="150"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}">Erreur</div>
                    </div>
                    <div class="col-md-4">
                        <label for="nif" class="form-label">NIF</label>
                        <input type="text" th:field="*{nif}" class="form-control" maxlength="50"
                               th:classappend="${#fields.hasErrors('nif')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nif}">Erreur</div>
                    </div>
                    <div class="col-md-4">
                        <label for="stat" class="form-label">STAT</label>
                        <input type="text" th:field="*{stat}" class="form-control" maxlength="50"
                               th:classappend="${#fields.hasErrors('stat')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{stat}">Erreur</div>
                    </div>
                    <div class="col-md-4">
                        <label for="rcs" class="form-label">RCS</label>
                        <input type="text" th:field="*{rcs}" class="form-control" maxlength="50"
                               th:classappend="${#fields.hasErrors('rcs')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{rcs}">Erreur</div>
                    </div>
                    <div class="col-12">
                        <label for="mentionsFacture" class="form-label">Mentions en bas de facture</label>
                        <textarea th:field="*{mentionsFacture}" class="form-control" rows="2"
                                  th:classappend="${#fields.hasErrors('mentionsFacture')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{mentionsFacture}">Erreur</div>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
        <span class="small text-muted ms-2" th:if="*{dateModification}">
            Dernière modification : <span th:text="${#temporals.format(parametre.dateModification, 'dd/MM/yyyy HH:mm')}">date</span>
        </span>
    </form>
</main>
</body>
</html>

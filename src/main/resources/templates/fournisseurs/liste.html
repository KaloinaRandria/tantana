<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Fournisseurs</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Fournisseurs</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <p class="text-muted mb-0"><span th:text="${page.totalElements}">0</span> fournisseur(s)</p>
        <a th:href="@{/achats/fournisseurs/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouveau fournisseur</a>
    </div>

    <form th:replace="~{fragments/commun :: filtres('/achats/fournisseurs', 'Nom ou pays')}"></form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Pays</th>
                    <th>Devise</th>
                    <th>Contact</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Aucun fournisseur trouvé.</td>
                </tr>
                <tr th:each="f : ${page.content}" th:classappend="${!f.actif} ? 'text-muted'">
                    <td class="fw-semibold" th:text="${f.nom}">Nom</td>
                    <td th:text="${f.pays}">Pays</td>
                    <td><span class="badge text-bg-light border" th:text="${f.devise}" th:title="${f.devise.libelle}">USD</span></td>
                    <td class="small">
                        <div th:text="${f.contact}">contact</div>
                        <div class="text-muted">
                            <span th:if="${f.telephone}" th:text="${f.telephone}">tel</span>
                            <span th:if="${f.telephone != null and f.email != null}"> · </span>
                            <a th:if="${f.email}" th:href="'mailto:' + ${f.email}" th:text="${f.email}">email</a>
                        </div>
                    </td>
                    <td><span th:replace="~{fragments/commun :: badgeStatut(${f.actif})}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/achats/fournisseurs/{id}/modifier(id=${f.id})}" class="btn btn-sm btn-outline-primary"
                           title="Modifier"><i class="bi bi-pencil"></i></a>
                        <form th:replace="~{fragments/commun :: boutonStatut('/achats/fournisseurs/' + ${f.id} + '/statut', ${f.actif})}"></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/commun :: pagination(${page}, '/achats/fournisseurs')}"></nav>
</main>
</body>
</html>

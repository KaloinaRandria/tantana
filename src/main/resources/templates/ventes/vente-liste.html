<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Ventes</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Ventes</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex gap-2">
            <a th:href="@{/ventes(statut='A_VALIDER')}" class="btn btn-warning" th:if="${ventesAValider > 0}">
                <i class="bi bi-hourglass-split"></i> À contrôler
                <span class="badge text-bg-light ms-1" th:text="${ventesAValider}">0</span></a>
            <a th:href="@{/ventes(impayees=true)}" class="btn" th:classappend="${impayees} ? 'btn-danger' : 'btn-outline-danger'">
                <i class="bi bi-wallet2"></i> Impayées</a>
            <a th:if="${impayees}" th:href="@{/ventes}" class="btn btn-outline-secondary">Toutes</a>
        </div>
        <a th:href="@{/ventes/nouvelle}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle vente</a>
    </div>

    <form th:action="@{/ventes}" method="get" class="row g-2 mb-3">
        <div class="col-12 col-md-6">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" name="q" th:value="${q}" class="form-control" placeholder="N° de facture ou client">
            </div>
        </div>
        <div class="col-8 col-md-4">
            <select name="statut" class="form-select" onchange="this.form.submit()">
                <option value="">Tous les statuts</option>
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}" th:selected="${s == statut}">Statut</option>
            </select>
        </div>
        <div class="col-4 col-md-2 d-grid">
            <button class="btn btn-outline-secondary" type="submit">Rechercher</button>
        </div>
    </form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>N°</th>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Vendeur</th>
                    <th class="text-end">Total TTC</th>
                    <th class="text-end">Reste à payer</th>
                    <th>Statut</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="8" class="text-center text-muted py-4">Aucune vente trouvée.</td>
                </tr>
                <tr th:each="v : ${page.content}">
                    <td><a th:href="@{/ventes/{id}(id=${v.id})}" class="fw-semibold text-decoration-none"
                           th:classappend="${v.numero == null} ? 'text-muted fst-italic'" th:text="${v.libelle}">FV</a></td>
                    <td th:text="${#temporals.format(v.dateVente, 'dd/MM/yyyy')}">date</td>
                    <td th:text="${v.client.nom}">Client</td>
                    <td class="small" th:text="${v.vendeur.nomComplet}">Vendeur</td>
                    <td class="text-end text-nowrap fw-semibold"
                        th:text="${#numbers.formatDecimal(v.totalTtc, 1, 'WHITESPACE', 0, 'COMMA')} + ' MGA'">0</td>
                    <td class="text-end text-nowrap">
                        <th:block th:if="${v.numero != null}">
                            <span th:if="${v.resteAPayer.signum() > 0}" class="text-danger"
                                  th:text="${#numbers.formatDecimal(v.resteAPayer, 1, 'WHITESPACE', 0, 'COMMA')}">0</span>
                            <span th:unless="${v.resteAPayer.signum() > 0}" class="badge"
                                  th:classappend="'text-bg-' + ${v.statutPaiement.couleur}" th:text="${v.statutPaiement.libelle}">Payée</span>
                        </th:block>
                    </td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${v.statut.couleur}" th:text="${v.statut.libelle}">Statut</span></td>
                    <td class="text-end">
                        <a th:if="${v.numero != null}" th:href="@{/ventes/{id}/facture.pdf(id=${v.id})}" target="_blank"
                           class="btn btn-sm btn-outline-secondary" title="Facture PDF"><i class="bi bi-file-earmark-pdf"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/commun :: pagination(${page})}"></nav>
</main>
</body>
</html>

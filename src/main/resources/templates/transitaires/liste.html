<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Transitaires</title>
</head>
<body>
<h1 layout:fragment="titre-page" class="h5 mb-0">Transitaires</h1>

<main layout:fragment="content">
    <div th:replace="~{fragments/commun :: alertes}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <p class="text-muted mb-0"><span th:text="${page.totalElements}">0</span> transitaire(s)</p>
        <a th:href="@{/achats/transitaires/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouveau transitaire</a>
    </div>

    <form th:replace="~{fragments/commun :: filtres('/achats/transitaires', 'Nom ou contact')}"></form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Contact</th>
                    <th>Adresse</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="5" class="text-center text-muted py-4">Aucun transitaire trouvé.</td>
                </tr>
                <tr th:each="t : ${page.content}" th:classappend="${!t.actif} ? 'text-muted'">
                    <td class="fw-semibold" th:text="${t.nom}">Nom</td>
                    <td class="small">
                        <div th:text="${t.contact}">contact</div>
                        <div class="text-muted">
                            <span th:if="${t.telephone}" th:text="${t.telephone}">tel</span>
                            <span th:if="${t.telephone != null and t.email != null}"> · </span>
                            <a th:if="${t.email}" th:href="'mailto:' + ${t.email}" th:text="${t.email}">email</a>
                        </div>
                    </td>
                    <td class="small" th:text="${t.adresse}">adresse</td>
                    <td><span th:replace="~{fragments/commun :: badgeStatut(${t.actif})}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/achats/transitaires/{id}/modifier(id=${t.id})}" class="btn btn-sm btn-outline-primary"
                           title="Modifier"><i class="bi bi-pencil"></i></a>
                        <form th:replace="~{fragments/commun :: boutonStatut('/achats/transitaires/' + ${t.id} + '/statut', ${t.actif})}"></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/commun :: pagination(${page}, '/achats/transitaires')}"></nav>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Tantana">Tantana</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ===== Sidebar (fixe sur grand ecran, tiroir sur mobile) ===== -->
<aside class="sidebar offcanvas-lg offcanvas-start d-flex flex-column" tabindex="-1" id="sidebar">
    <div class="d-flex align-items-center justify-content-between px-3 py-3">
        <a class="marque" th:href="@{/}"><i class="bi bi-box-seam me-2"></i>Tantana</a>
        <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                data-bs-target="#sidebar" aria-label="Fermer"></button>
    </div>

    <nav class="flex-grow-1 overflow-auto">
        <ul class="nav flex-column">
            <li>
                <a class="nav-link" th:href="@{/}" th:classappend="${urlCourante == '/'} ? 'active'">
                    <i class="bi bi-house"></i> Accueil</a>
            </li>
        </ul>

        <div class="titre-section">Opérations</div>
        <ul class="nav flex-column">
            <li sec:authorize="hasAnyRole('ADMIN','VENDEUR')">
                <a class="nav-link" th:href="@{/ventes}"
                   th:classappend="${#strings.startsWith(urlCourante, '/ventes')} ? 'active'">
                    <i class="bi bi-cart3"></i> Ventes</a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE_STOCK','ACHETEUR')">
                <a class="nav-link" th:href="@{/stock}"
                   th:classappend="${#strings.startsWith(urlCourante, '/stock')} ? 'active'">
                    <i class="bi bi-boxes"></i> Stock</a>
            </li>
        </ul>

        <th:block sec:authorize="hasAnyRole('ADMIN','ACHETEUR')">
            <div class="titre-section">Achats</div>
            <ul class="nav flex-column">
                <li>
                    <a class="nav-link" th:href="@{/achats/commandes}"
                       th:classappend="${#strings.startsWith(urlCourante, '/achats/commandes')} ? 'active'">
                        <i class="bi bi-truck"></i> Commandes</a>
                </li>
                <li>
                    <a class="nav-link" th:href="@{/achats/receptions}"
                       th:classappend="${#strings.startsWith(urlCourante, '/achats/receptions')} ? 'active'">
                        <i class="bi bi-box-arrow-in-down"></i> Réceptions
                        <span th:if="${receptionsAValider > 0}" class="badge rounded-pill text-bg-warning ms-auto"
                              th:text="${receptionsAValider}" title="Réceptions à valider">1</span>
                    </a>
                </li>
                <li>
                    <a class="nav-link" th:href="@{/achats/fournisseurs}"
                       th:classappend="${#strings.startsWith(urlCourante, '/achats/fournisseurs')} ? 'active'">
                        <i class="bi bi-globe2"></i> Fournisseurs</a>
                </li>
                <li>
                    <a class="nav-link" th:href="@{/achats/transitaires}"
                       th:classappend="${#strings.startsWith(urlCourante, '/achats/transitaires')} ? 'active'">
                        <i class="bi bi-building"></i> Transitaires</a>
                </li>
            </ul>
        </th:block>

        <th:block sec:authorize="hasAnyRole('ADMIN','ACHETEUR','GESTIONNAIRE_STOCK')">
            <div class="titre-section">Catalogue</div>
            <ul class="nav flex-column">
                <li>
                    <a class="nav-link" th:href="@{/articles}"
                       th:classappend="${#strings.startsWith(urlCourante, '/articles')} ? 'active'">
                        <i class="bi bi-tags"></i> Articles</a>
                </li>
            </ul>
        </th:block>

        <th:block sec:authorize="hasRole('ADMIN')">
            <div class="titre-section">Système</div>
            <ul class="nav flex-column">
                <li>
                    <a class="nav-link" th:href="@{/admin}"
                       th:classappend="${#strings.startsWith(urlCourante, '/admin')} ? 'active'">
                        <i class="bi bi-gear"></i> Administration</a>
                </li>
            </ul>
        </th:block>
    </nav>

    <!-- Utilisateur connecte + deconnexion -->
    <div class="utilisateur p-3 d-flex align-items-center gap-2">
        <span class="avatar" th:text="${#strings.substring(#authentication.name, 0, 1)}">A</span>
        <div class="flex-grow-1 text-truncate small">
            <div class="text-white fw-semibold text-truncate" sec:authentication="name">utilisateur</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-sm btn-outline-light" type="submit" title="Déconnexion">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>
</aside>

<!-- ===== Contenu ===== -->
<div class="contenu d-flex flex-column min-vh-100">
    <header class="barre-haut d-flex align-items-center px-3 px-lg-4 gap-3">
        <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
            <i class="bi bi-list"></i>
        </button>
        <h1 class="h5 mb-0" layout:fragment="titre-page">Tantana</h1>
    </header>

    <main class="flex-grow-1 p-3 p-lg-4" layout:fragment="content"></main>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

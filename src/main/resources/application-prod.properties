# ===== Environnement de production =====
# Les secrets ne sont JAMAIS ecrits ici : ils viennent des variables d'environnement
# (DB_URL, DB_USERNAME, DB_PASSWORD). Sans elles, l'application refuse de demarrer.

# Serveur
server.port=${PORT:8080}
server.compression.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Base de donnees PostgreSQL (aucune valeur par defaut)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway : interdit de vider la base en production
spring.flyway.clean-disabled=true

# Thymeleaf : cache active
spring.thymeleaf.cache=true

# Ressources statiques mises en cache par le navigateur
spring.web.resources.cache.period=7d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**


# Logs
logging.level.root=WARN
logging.level.mg.working.tantana=INFO
logging.file.name=${LOG_FILE:logs/tantana.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

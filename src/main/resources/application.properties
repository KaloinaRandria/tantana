spring.application.name=tantana

# Prefixe des URL : http://localhost:8080/tantana
server.servlet.context-path=/tantana

# Profil actif par defaut (surcharger avec SPRING_PROFILES_ACTIVE=prod en production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA : le schema est gere par Flyway, Hibernate se contente de valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Secrets locaux (mots de passe BD) : fichier hors git dans src/main/resources.
spring.config.import=optional:classpath:application-secret.properties

# Base de donnees PostgreSQL : valeurs issues de application-secret.properties
# ou des variables d'environnement (prioritaires)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
